# Security headers. `always` adds them to error responses (4xx, 5xx) too.

# Browsers use HTTPS only for two years, subdomains included. Add `preload` only
# once every subdomain serves HTTPS: removal from the preload list takes months.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Only this origin may supply scripts, styles, frames, forms and connections.
# Loosen per directive when the application needs a CDN or an API on another host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Legacy browsers that ignore CSP frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
