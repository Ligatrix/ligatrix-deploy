# Site configuration: HTTP redirects to HTTPS; HTTPS proxies to the app.

# Rate limits, keyed by client address. Sign-in endpoints get a tight budget to slow
# down password guessing; everything else gets a generous one that only stops floods.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=per_client:10m;
limit_req_status 429;
limit_conn_status 429;

upstream app_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    # Reuse connections to the app instead of opening one per request.
    keepalive 32;
    # Must stay below the app's keepAliveTimeout (65 s) to avoid 502s on reuse.
    keepalive_timeout 60s;
}

server {
    # IPv4 only: Docker disables IPv6 inside containers on default networks, and a
    # [::] listen would stop nginx from starting. Add `listen [::]:8080` with IPv6 on.
    listen 8080 default_server;
    server_name _;

    # Container healthcheck; plain HTTP, never redirected.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Certificate issuance and renewal (HTTP-01 webroot challenge).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    # Every response from this server carries the security headers. No location
    # below uses add_header, so none of them silently drops these.
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn per_client 50;

    # The probe endpoints are for Docker and the proxy, not for the internet.
    location ~ ^/(healthz|readyz)$ {
        return 404;
    }

    location ~ ^/(login|logout|signin|signup|auth|password|api/auth)(/|$) {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }
}
