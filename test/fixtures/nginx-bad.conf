http {
    upstream app_backend {
        server app:3000;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://app_backend;
        }
    }

    server {
        listen 443 ssl;
        ssl_protocols TLSv1 TLSv1.2;
        add_header Strict-Transport-Security "max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://app_backend;
        }
    }
}
