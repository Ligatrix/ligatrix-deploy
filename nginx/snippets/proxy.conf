# Proxy settings shared by every location that forwards to the app.
proxy_pass http://app_backend;

# HTTP/1.1 with an empty Connection header is what lets upstream keepalive work.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Replaces any client-supplied value: request ids are assigned here, not trusted.
proxy_set_header X-Request-ID $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Retry another upstream on connection errors. nginx never retries POST and other
# non-idempotent methods unless told to, so this cannot double-submit a form.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;

proxy_hide_header X-Powered-By;
